[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "valkyries-analytics"
version = "0.1.0"
description = "Decision-support analytics for the Golden State Valkyries."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.117,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
database = [
    "psycopg[binary,pool]>=3.2,<4",
]
modeling = [
    "arviz>=0.20,<1",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pymc>=5.20,<6",
    "scikit-learn>=1.6,<2",
    "xgboost>=3.0,<4",
]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
valkyries = "valkyries.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
valkyries = [
    "templates/*.html",
    "static/*",
    "published/*.json",
    "sql/*.sql",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["valkyries"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pymc", "pymc.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
