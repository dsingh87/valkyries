[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "valkyries-analytics"
version = "0.1.0"
description = "Decision-support analytics for the Golden State Valkyries."
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]